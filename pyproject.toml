[project]
name = "jevesmo"
version = "0.1.0"
description = "Sistema de apoyo a la decision clinica oncologica basado en guias ESMO y el modelo System One Jev (TypeSafe AI)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "streamlit>=1.32",
    "typesafe-sdk>=0.1; python_version >= '3.10'",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
llm = [
    # Backend LLM alternativo (JES-4, opt-in). El extra [openai] del adaptador
    # trae el SDK de OpenAI; anthropic/gemini tienen extras homologos.
    "system-one-adapter[openai]>=0.2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
